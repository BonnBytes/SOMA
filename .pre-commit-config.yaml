repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        args: ["--profile", "black"]
        files: ^(scripts/convergence/random_projection/|tests/test_randomprojection\.py)
        types: [python]

      - id: black  
        name: black
        entry: uv run black
        language: system 
        args: ["--target-version", "py312"]
        files: ^(scripts/convergence/random_projection/|tests/test_randomprojection\.py)
        types: [python]

      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        files: ^(scripts/convergence/random_projection/|tests/test_randomprojection\.py)$
        types: [python]

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        files: ^(scripts/convergence/random_projection/|tests/test_randomprojection\.py)
        types: [python]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        files: ^tests/test_randomprojection\.py$
        pass_filenames: false
        always_run: true