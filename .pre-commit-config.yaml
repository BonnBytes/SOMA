repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: uv run isort
        language: system
        args: ["--profile", "black"]
        files: ^(scripts/toy_random_projection/|src/|tests/)
        types: [python]
        pass_filenames: true
        always_run: true

      - id: black  
        name: black
        entry: uv run black
        language: system 
        args: ["--target-version", "py313"]
        files: ^(scripts/toy_random_projection/|src/|tests/)
        types: [python]
        pass_filenames: true
        always_run: true

      - id: flake8
        name: flake8
        entry: uv run flake8
        language: system
        files: ^(scripts/toy_random_projection/|src/|tests/)
        types: [python]
        pass_filenames: true
        always_run: true

      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        files: ^(scripts/toy_random_projection/|src/|tests/)$
        types: [python]
        pass_filenames: false
        always_run: true

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        files: ^tests/$
        pass_filenames: false
        always_run: true